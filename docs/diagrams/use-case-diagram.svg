<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-label="GroupTrack Use Case Diagram">
  <defs>
    <style>
      .title { font: 700 34px Arial, sans-serif; fill: #111827; }
      .actor { font: 600 18px Arial, sans-serif; fill: #111827; }
      .uc { font: 600 16px Arial, sans-serif; fill: #111827; }
      .small { font: 500 14px Arial, sans-serif; fill: #374151; }
      .line { stroke: #111827; stroke-width: 2; fill: none; }
      .sys { fill: #f9fafb; stroke: #111827; stroke-width: 2.4; rx: 18; }
      .oval { fill: #eef2ff; stroke: #4338ca; stroke-width: 2.1; }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="900" fill="#e5e7eb"/>
  <text x="600" y="56" text-anchor="middle" class="title">GroupTrack Use Case Diagram</text>

  <rect class="sys" x="290" y="110" width="820" height="700" />
  <text x="700" y="145" text-anchor="middle" class="actor">GroupTrack System</text>

  <circle cx="130" cy="240" r="28" fill="#111827"/>
  <line x1="130" y1="268" x2="130" y2="350" class="line"/>
  <line x1="80" y1="300" x2="180" y2="300" class="line"/>
  <line x1="130" y1="350" x2="90" y2="420" class="line"/>
  <line x1="130" y1="350" x2="170" y2="420" class="line"/>
  <text x="130" y="455" text-anchor="middle" class="actor">Student User</text>

  <ellipse class="oval" cx="500" cy="220" rx="140" ry="45"/>
  <text x="500" y="225" text-anchor="middle" class="uc">Authenticate Account</text>

  <ellipse class="oval" cx="860" cy="220" rx="140" ry="45"/>
  <text x="860" y="225" text-anchor="middle" class="uc">Create Project</text>

  <ellipse class="oval" cx="500" cy="360" rx="150" ry="45"/>
  <text x="500" y="365" text-anchor="middle" class="uc">Join Project with Code</text>

  <ellipse class="oval" cx="860" cy="360" rx="150" ry="45"/>
  <text x="860" y="365" text-anchor="middle" class="uc">Manage Tasks</text>

  <ellipse class="oval" cx="500" cy="500" rx="160" ry="45"/>
  <text x="500" y="505" text-anchor="middle" class="uc">Assign Members and Roles</text>

  <ellipse class="oval" cx="860" cy="500" rx="170" ry="45"/>
  <text x="860" y="505" text-anchor="middle" class="uc">Update Task Status Workflow</text>

  <ellipse class="oval" cx="500" cy="640" rx="170" ry="45"/>
  <text x="500" y="645" text-anchor="middle" class="uc">Receive Deadline Notifications</text>

  <ellipse class="oval" cx="860" cy="640" rx="145" ry="45"/>
  <text x="860" y="645" text-anchor="middle" class="uc">View Analytics</text>

  <line x1="180" y1="290" x2="360" y2="220" class="line"/>
  <line x1="180" y1="305" x2="710" y2="220" class="line"/>
  <line x1="180" y1="320" x2="350" y2="360" class="line"/>
  <line x1="180" y1="335" x2="710" y2="360" class="line"/>
  <line x1="180" y1="350" x2="340" y2="500" class="line"/>
  <line x1="180" y1="365" x2="690" y2="500" class="line"/>
  <line x1="180" y1="380" x2="335" y2="640" class="line"/>
  <line x1="180" y1="395" x2="715" y2="640" class="line"/>

  <text x="700" y="785" text-anchor="middle" class="small">Simple user-centered interaction view for GroupTrack core features</text>
</svg>
